services:
  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE must reference an immutable image digest}"
    environment:
      APP_ENV: staging
      DEV_EXPOSE_TOKENS: "false"
      ADMIN_EMAILS: ${ADMIN_EMAILS:?ADMIN_EMAILS must be configured}
      EQUIPMENT_DB_PATH: /app/data/equipment.db
      HTTP_ADDR: ":8080"
    ports:
      - "127.0.0.1:18082:8080"
    volumes:
      - equipment-manager-stage-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  equipment-manager-stage-data:
