services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      APP_ENV: staging
      DEV_EXPOSE_TOKENS: "false"
      ADMIN_EMAILS: ${ADMIN_EMAILS:?set ADMIN_EMAILS in deploy/staging/.env}
      EQUIPMENT_DB_PATH: /app/data/equipment.db
      HTTP_ADDR: ":8080"
    volumes:
      - type: bind
        source: ${STAGING_DATA_DIR:?set STAGING_DATA_DIR in deploy/staging/.env}
        target: /app/data
    expose:
      - "8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  caddy:
    image: caddy:2.10-alpine
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?set STAGING_DOMAIN in deploy/staging/.env}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
