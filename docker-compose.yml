services:
  backend:
    build:
      context: .
    environment:
      EQUIPMENT_DB_PATH: /app/data/equipment.db
      HTTP_ADDR: ":8080"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - equipment-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  equipment-data:
