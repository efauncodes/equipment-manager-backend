name: Deploy monorepo images to VPS

on:
  workflow_dispatch:
    inputs:
      app:
        required: true
        type: choice
        options:
          - equipment
      frontend_image:
        required: true
        type: string
      backend_image:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP: ${{ inputs.app }}
      FRONTEND_IMAGE: ${{ inputs.frontend_image }}
      BACKEND_IMAGE: ${{ inputs.backend_image }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SSH_HOST: 159.195.250.23
      SSH_USER: efaun
    steps:
      - name: Prepare verified SSH transport
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -eu
          ssh_dir="$RUNNER_TEMP/monorepo-staging-ssh"
          mkdir -p "$ssh_dir"
          printf '%s\n' "$STAGING_SSH_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"
      - name: Deploy both monorepo services and verify readiness
        run: |
          set -eu
          ssh -i "$SSH_DIR/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "$SSH_USER@$SSH_HOST" sudo sh -s -- \
            "$APP" "$FRONTEND_IMAGE" "$BACKEND_IMAGE" "$SOURCE_SHA" <<'REMOTE'
          set -eu
          app=$1
          frontend_image=$2
          backend_image=$3
          source_sha=$4
          case "$app" in
            equipment)
              stage_dir=/opt/equipment-manager-stage
              frontend_prefix=ghcr.io/efauncodes/equipment-manager-frontend
              backend_prefix=ghcr.io/efauncodes/equipment-manager-backend
              frontend_health=http://127.0.0.1:18083/healthz
              backend_health=http://127.0.0.1:18082/readyz
              old_frontend=/opt/equipment-manager-frontend-stage/compose.yaml
              old_backend=/opt/equipment-manager-backend-stage/compose.yaml
              ;;
            *) exit 64 ;;
          esac
          printf '%s\n' "$frontend_image" | grep -Eq "^${frontend_prefix}@sha256:[0-9a-f]{64}$"
          printf '%s\n' "$backend_image" | grep -Eq "^${backend_prefix}@sha256:[0-9a-f]{64}$"
          printf '%s\n' "$source_sha" | grep -Eq '^[0-9a-f]{40}$'
          env_file="$stage_dir/.env"
          compose_file="$stage_dir/compose.yaml"
          test -f "$env_file"
          test -f "$compose_file"
          set_env() {
            key=$1
            value=$2
            if grep -q "^${key}=" "$env_file"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$env_file"
            else
              printf '%s=%s\n' "$key" "$value" >> "$env_file"
            fi
          }
          set_env FRONTEND_IMAGE "$frontend_image"
          set_env BACKEND_IMAGE "$backend_image"
          set_env DEPLOY_COMMIT "$source_sha"
          set_env APP_VERSION "$source_sha"
          if [ -f "$old_frontend" ]; then docker compose -f "$old_frontend" down; fi
          if [ -f "$old_backend" ]; then docker compose -f "$old_backend" down; fi
          docker compose --env-file "$env_file" -f "$compose_file" config --quiet
          docker compose --env-file "$env_file" -f "$compose_file" pull
          docker compose --env-file "$env_file" -f "$compose_file" up -d --remove-orphans
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$frontend_health" >/dev/null &&
               curl --fail --silent --show-error "$backend_health" >/dev/null; then
              docker compose --env-file "$env_file" -f "$compose_file" ps
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file "$env_file" -f "$compose_file" ps -a
          docker compose --env-file "$env_file" -f "$compose_file" logs --tail=200
          exit 1
          REMOTE
